  <!-- Set theme/lang/dir before first paint so there is no flash. -->
  <script>
    (function () {
      var d = document.documentElement;
      var theme = 'light';
      try {
        var saved = localStorage.getItem('theme');
        // First visit: pick by the visitor's local time (day 06:00-17:59 light, evening and night dark).
        // Once the visitor uses the toggle, that choice is saved and wins on later visits.
        var h = new Date().getHours();
        theme = saved === 'dark' || saved === 'light' ? saved : (h >= 6 && h < 18 ? 'light' : 'dark');
      } catch (e) {}
      d.setAttribute('data-theme', theme);
      var lang = location.pathname.indexOf('/ar') === 0 ? 'ar' : 'en';
      d.lang = lang;
      d.dir = lang === 'ar' ? 'rtl' : 'ltr';
    })();
  </script>
